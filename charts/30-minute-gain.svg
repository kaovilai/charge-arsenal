<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="40" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">30-minute charge gain from 0% state of charge</text>
  <text x="40" y="68" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4b5563">Watt-hours recovered in 30 minutes, using the best wall-brick route</text>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="125">MacBook Pro 14 M4 Pro</text>
    <rect x="240" y="108" width="520" height="28" rx="4" fill="#2563eb"/>
    <text x="770" y="127" text-anchor="end" fill="#ffffff" font-weight="600">40.8 Wh</text>

    <text x="40" y="185">CUKTECH 10</text>
    <rect x="240" y="168" width="472" height="28" rx="4" fill="#16a34a"/>
    <text x="702" y="187" text-anchor="end" fill="#ffffff" font-weight="600">37.0 Wh</text>

    <text x="40" y="245">Raydyn Y270</text>
    <rect x="240" y="228" width="252" height="28" rx="4" fill="#f59e0b"/>
    <text x="482" y="247" text-anchor="end" fill="#ffffff" font-weight="600">19.8 Wh</text>

    <text x="40" y="305">Galaxy Z Fold7</text>
    <rect x="240" y="288" width="135" height="28" rx="4" fill="#dc2626"/>
    <text x="365" y="307" text-anchor="end" fill="#ffffff" font-weight="600">10.6 Wh</text>

    <text x="40" y="365">iPad 10th generation</text>
    <rect x="240" y="348" width="108" height="28" rx="4" fill="#7c3aed"/>
    <text x="338" y="367" text-anchor="end" fill="#ffffff" font-weight="600">8.5 Wh</text>

    <text x="40" y="425">Galaxy Watch8</text>
    <rect x="240" y="408" width="21" height="28" rx="4" fill="#0f766e"/>
    <text x="267" y="427" fill="#111827" font-weight="600">1.6 Wh</text>
  </g>

  <line x1="240" y1="470" x2="760" y2="470" stroke="#d1d5db" stroke-width="1"/>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="240" y="490" text-anchor="middle">0 Wh</text>
    <text x="500" y="490" text-anchor="middle">20 Wh</text>
    <text x="760" y="490" text-anchor="middle">40 Wh</text>
  </g>
</svg>
